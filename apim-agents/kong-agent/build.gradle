plugins {
    id 'net.researchgate.release' version '2.8.0'
}

apply from: "$rootDir/../../common-gradle-scripts/go.gradle"

release {
    tagTemplate = 'apim-apk-agent-$version'

    git {
        requireBranch = project.hasProperty('releaseBranch') ? project.releaseBranch : 'master'
        pushToRemote = "origin"
    }
}

allprojects {
    group = project.group
    version = project.version
}

// Define default values for plugin output name and path
ext {
    pluginOutputName = project.hasProperty('pluginOutputName') ? project.pluginOutputName : 'agent.so'
    pluginOutputPath = project.hasProperty('pluginOutputPath') ? project.pluginOutputPath : '../../apim-agents/agents'
    pluginSourceFile = project.hasProperty('pluginSourceFile') ? project.pluginSourceFile : 'main.go'
}

tasks.register('go_test', Exec) {
    group = 'go'
    description = 'Automates testing the packages named by the import paths.'
    commandLine 'sh', '-c', "go test -race -coverprofile=coverage.out -covermode=atomic ./..."
    environment "APK_HOME", "$rootDir"
    outputs.files file("coverage.out")
}

tasks.named('go_revive_run').configure {
    finalizedBy go_tidy
    finalizedBy go_test
}


tasks.register('go_run_build', Exec) {
    dependsOn go_revive_run
    dependsOn go_vet
    println("Running go build")
    commandLine 'go', 'build', '-buildmode=plugin', '-o', "${pluginOutputPath}/${pluginOutputName}", pluginSourceFile
    outputs.file("${pluginOutputPath}/${pluginOutputName}")
}

task build {
    dependsOn go_run_build
}
